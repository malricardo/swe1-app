language: python
python:
  - "3.9"

env:
  global:
    - DJANGO_SECRET_KEY=travis-test-secret-key

install:
  - python -m pip install --upgrade pip
  - pip install -r requirements.txt

script:
  ## Adding coveralls
  - black --check .
  - flake8 .
  - coverage run manage.py test
  - coveralls

deploy:
  provider: elasticbeanstalk
  region: us-east-2
  app: django-tutorial
  env: Django-tutorial-env
  on:
    branch: main